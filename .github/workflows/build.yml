name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'    # Matches tags like v1.0.0, v1.0.1
      - '*.*.*'     # Matches tags like 1.0.0, 1.0.1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permissions to attach artifacts to GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment
        # Add your build tool setups here (e.g., Node.js, Python, Rust, Go)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build project
        run: |
          # Replace with your actual build commands
          npm ci
          npm run build

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            path/to/build/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
