name: Build and Release Linux App

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev portaudio19-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name FretSense --paths src --add-data "assets:assets" main.py

      - name: Compress Release
        run: |
          cd dist
          tar -czvf FretSense-Linux.tar.gz FretSense

      - name: Upload Linux Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: dist/FretSense-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
