name: Build Cross-Platform Release Assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            asset_name: FretTrain-v1.0.0-windows-x64.zip
            script: |
              pyinstaller --noconfirm --onedir --windowed --name "FretTrain" main.py
              powershell Compress-Archive -Path dist/FretTrain -DestinationPath FretTrain-v1.0.0-windows-x64.zip
          - os: macos-latest
            asset_name: FretTrain-v1.0.0-macOS.dmg
            script: |
              pip install pyinstaller
              pyinstaller --noconfirm --onedir --windowed --name "FretTrain" main.py
              brew install create-dmg
              create-dmg --volname "FretTrain Installer" --window-pos 200 120 --window-size 800 400 --icon-size 100 --icon "FretTrain.app" 200 190 --hide-extension "FretTrain.app" --app-drop-link 600 190 "FretTrain-v1.0.0-macOS.dmg" "dist/FretTrain.app"
          - os: ubuntu-latest
            asset_name: FretTrain-v1.0.0-linux-x86_64.tar.gz
            script: |
              pip install pyinstaller
              pyinstaller --noconfirm --onedir --windowed --name "FretTrain" main.py
              tar -czvf FretTrain-v1.0.0-linux-x86_64.tar.gz -C dist/ FretTrain

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Build Asset
        run: ${{ matrix.script }}
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
