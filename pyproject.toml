[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frettrain"
version = "0.1.0"
description = "Fretboard & Chord Trainer Application"
authors = [{ name = "Arthur Belanger" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "aubio>=0.4.9"
]

[tool.setuptools.packages.find]
where = ["src"]
